<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teams - SPL Auction</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    @media (max-width: 768px) {
      nav, .container, .content {
        flex-direction: column !important;
        width: 100% !important;
      }
      img {
        max-width: 100%;
        height: auto;
      }
      table {
        width: 100%;
        overflow-x: auto;
        display: block;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Teams</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="team.html">Teams</a>
          </nav>
  </header>

  <main class="teams">
    <h2 style="text-align:center">All Teams</h2>
    <div id="teams-container" class="teams"></div>
  </main>

  <div id="team-details" class="admin-panel" style="display: none;">
    <h2 id="team-name"></h2>
    <h3>Players</h3>
    <ul id="player-list"></ul>
    <button onclick="closeDetails()">Close</button>
  </div>

  <script src="team.js"></script>

<script>
const backendURL = "https://spl-auction-backend.onrender.com";

async function loadTeams() {
  const teamRes = await fetch(`${backendURL}/api/teams`);
  const teams = await teamRes.json();

  const playerRes = await fetch(`${backendURL}/api/players`);
  const players = await playerRes.json();

  const container = document.getElementById("teams-container");
  container.innerHTML = "";

  teams.forEach(team => {
    const teamPlayers = players.filter(p => p.team_id === team.id);
    const html = `
      <div class="team-card">
        <h3>${team.name}</h3>
        <img src="${team.logo}" alt="${team.name}" style="max-height:100px" />
        <ul>
          ${teamPlayers.map(p => `<li>${p.name} - ${p.role}${p.isCaptain ? ' (C)' : ''}</li>`).join("")}
        </ul>
      </div>`;
    container.innerHTML += html;
  });
}

window.onload = loadTeams;
</script>


<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  const socket = io("https://spl-auction-backend.onrender.com");

  socket.on("new-team", (team) => {
    console.log("New team added:", team);
    const teamContainer = document.querySelector(".team-container");
    if (teamContainer) {
      const teamCard = document.createElement("div");
      teamCard.className = "team-card";
      teamCard.innerHTML = `
        <img src="${team.logo}" alt="${team.name}" class="team-logo" />
        <h3>${team.name}</h3>
      `;
      teamContainer.appendChild(teamCard);
    }
  });

  socket.on("new-player", (player) => {
    console.log("New player added:", player);
    const teamSections = document.querySelectorAll(".team-card");
    teamSections.forEach((card) => {
      if (card.querySelector("h3")?.textContent === player.teamName) {
        const playerList = card.querySelector(".player-list") || document.createElement("ul");
        playerList.className = "player-list";
        const li = document.createElement("li");
        li.textContent = `${player.name} (${player.role})${player.isCaptain ? " 🧢" : ""}`;
        playerList.appendChild(li);
        if (!card.querySelector(".player-list")) {
          card.appendChild(playerList);
        }
      }
    });
  });

</script>
</body>
</html>
